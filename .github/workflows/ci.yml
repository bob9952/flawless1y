name: CI and optional deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Pošalji dist/ na produkcioni server"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: flawless1y-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Provera i build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Preuzmi repozitorijum
        uses: actions/checkout@v7

      - name: Podesi Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instaliraj dependencies
        run: npm ci

      - name: Proveri formatiranje
        run: npm run format:check

      - name: Pokreni ESLint
        run: npm run lint

      - name: Proveri TypeScript
        run: npm run typecheck

      - name: Napravi Vite build
        run: npm run build:vite

      - name: Sačuvaj dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: flawless1y-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Ručni deploy preko SSH-a
    needs: quality
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Preuzmi dist artifact
        uses: actions/download-artifact@v8
        with:
          name: flawless1y-dist
          path: dist/

      - name: Proveri deploy konfiguraciju
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          test -n "$SSH_HOST" || { echo "Nedostaje SSH_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "Nedostaje SSH_USER"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Nedostaje SSH_PRIVATE_KEY"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Nedostaje SSH_KNOWN_HOSTS"; exit 1; }
          test -n "$SSH_TARGET_DIR" || { echo "Nedostaje SSH_TARGET_DIR"; exit 1; }

      - name: Pošalji dist na server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          scp -P "$SSH_PORT" -i ~/.ssh/id_ed25519 -r dist/. "$SSH_USER@$SSH_HOST:${SSH_TARGET_DIR%/}/"
